name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # lib/sample-app.generated.ts is a checked-in snapshot of app/samples/**,
      # bundled into every downloaded project. Fail if it drifts from source.
      - name: Check bundled sample app is up to date
        run: |
          npm run generate:sample-app
          git diff --exit-code -- lib/sample-app.generated.ts \
            || { echo "::error::lib/sample-app.generated.ts is stale — run 'npm run generate:sample-app' and commit the result."; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
